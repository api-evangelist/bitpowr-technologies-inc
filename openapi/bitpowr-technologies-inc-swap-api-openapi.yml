      description: This endpoint swaps from one crypto currency to another
      operationId: createswap
      parameters: []
      requestBody:
        content:
          application/json:
            encoding: {}
            schema:
              required:
              - sourceCurrency
              - sourceAmount
              - destinationCurrency
              - destinationAddress
              type: object
              properties:
                sourceCurrency:
                  type: string
                  description: The currency you want to swap from
                  example: BTC
                sourceAmount:
                  type: number
                  description: The amount you want to swap
                  example: '200'
                destinationCurrency:
                  type: string
                  description: The currency you want to swap to
                  example: TRON
                destinationAddress:
                  type: string
                  description: The address you want to swap the asset to
                  example: Tv...
