openapi: 3.0.0
info:
  title: Bitpowr Reference Account Utils API
  contact: {}
  version: '1.0'
  x-apievangelist-source: reconstructed from docs.bitpowr.com ReadMe per-operation OpenAPI fragments (2026-07-18)
servers:
- url: https://developers.bitpowr.com/api/v1
tags:
- name: Utils
paths:
  /utils/generateToken:
    post:
      tags:
      - Utils
      summary: Generate Token
      description: This endpoint generates a token for authentication purposes.
      operationId: generateToken
      requestBody:
        content:
          application/json:
            schema:
              required:
              - public_key
              - secret_key
              type: object
              properties:
                public_key:
                  type: string
                  description: The public key
                  example: pk_test_gAArHE6Z1LAljAIgAXi1zbsNQvlCcNryFMWH4LYUBW1tlkY4bx
                secret_key:
                  type: string
                  description: The secret key
                  example: sk_test_pIdvBw7l8qIKMAQG4VhfFh44Lsp5PAETieRJM9cIiQ7vN0aak0.
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: GenerateTokenResponse
                type: object
                properties:
                  token:
                    type: string
                example:
                  token: cGtfdGVzdF9ngAXilCcN1zbsQUFyHE6W1LAljAINQvryFMWH4LYUBW1tlkY4bx
      deprecated: false
      security:
      - bearer: []
  /utils/raw-internal-tx:
    get:
      tags:
      - Utils
      summary: Get raw internal transaction
      description: This endpoint retrieves raw internal transaction details based on the provided transaction ID and hash.
      operationId: getRawInternalTx
      parameters:
      - name: txId
        in: query
        description: The transaction ID
        required: true
        schema:
          type: string
      - name: hash
        in: query
        description: The transaction hash
        required: true
        schema:
          type: string
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: RawInternalTx
                required:
                - status
                - event
                - data
                type: object
                properties:
                  status:
                    type: string
                  event:
                    type: string
                  data:
                    type: object
                example:
                  status: success
                  event: transaction.success
                  data:
                    amount: '0'
                    fee: '0'
                    hash: a834591c77de0e65826f5409a4520bccad0c1a55a18ec98f3d1fe0d394f8270e
