  /utils/validate-address:
    post:
      tags:
      - Utils
      summary: Validate address
      description: This endpoint validates the given address for a specific network and asset.
      operationId: validateAddress
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - address
              - network
              - asset
              type: object
              properties:
                address:
                  type: string
                  description: The address to be validated
                  example: '0x71aa91309607050952b085f252209f2e1f18eda2'
                network:
                  type: string
                  description: The network on which the address exists
                  example: mainnet
                asset:
                  type: string
                  description: The asset associated with the address
                  example: ETH
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: validateAddress
                required:
                - status
                - message
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                example:
                  status: success
                  message: '''0x71aa91309607050952b085f252209f2e1f18eda2'' is valid ETHEREUM address'
      deprecated: false
      security:
      - bearer: []
  /utils/validate-transaction:
    post:
      tags:
      - Utils
      summary: Validate transaction
      description: This endpoint validates a transaction by providing essential details such as hash, address, etc.
      operationId: validateTransaction
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              required:
              - address
              - network
              - hash
              - chain
              - amount
              type: object
              properties:
                hash:
                  type: string
                  description: The hash of the transaction
                  example: 0x123abc...
                address:
                  type: string
                  description: The address associated with the transaction
                  example: '0x71aa91309607050952b085f252209f2e1f18eda2'
                chain:
                  type: string
                  description: The blockchain chain
                  example: ethereum
                currency:
                  type: string
                  description: The currency used in the transaction
                  example: USD
                contractAddress:
                  type: string
                  description: The contract address
                  example: 0x456def...
                amount:
                  type: string
                  description: The amount transacted
                  example: '1.5'
                transactionIndex:
                  type: string
                  description: The index of the transaction
                  example: '123'
                network:
                  type: string
                  description: The network on which the transaction occurred
                  example: mainnet
        required: false
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                title: validateTransaction
                required:
                - status
                - message
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                example: {}
      deprecated: false
      security:
      - bearer: []
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
