openapi: 3.0.0
info:
  title: Bitpowr Reference Account API
  contact: {}
  version: '1.0'
  x-apievangelist-source: reconstructed from docs.bitpowr.com ReadMe per-operation OpenAPI fragments (2026-07-18)
servers:
- url: https://developers.bitpowr.com/api/v1
tags:
- name: Account
paths:
  /accounts:
    post:
      tags:
      - Account
      summary: Create accounts
      description: This endpoint creates an account
      operationId: Createaccounts
      parameters: []
      requestBody:
        content:
          application/json:
            encoding: {}
            schema:
              required:
              - name
              - passphrase
              type: object
              properties:
                name:
                  type: string
                  description: The name of the account/wallet you want to create.
                  example: TEST  jan 19
                passphrase:
                  type: string
                  description: Something simillar to a passowrd for your wallet/account.
                  example: ioetdf0isd08
                type:
                  type: string
                  description: Could be DEFAULT/SELF_CUSTODY/SAVINGS/EXCHANGES
                  example: DEFAULT
                showInDashboard:
                  type: boolean
                  description: Choose whether to show account/wallet in dashboard
                  example: false
                assets:
                  type: string
                  description: arrays of assets you want to add to your account/wallet
                  example: BTC
                externalId:
                  type: string
                  description: The external unique id / random generated string
                  example: BTC
                email:
                  type: string
                  description: required only for SELF_CUSTODY type
                  example: BTC
        required: false
      responses:
        '200':
          description: ''
          headers: {}
      deprecated: false
      security:
      - bearer: []
    get:
      tags:
      - Account
      summary: Get account
      description: This endpoint returns all user's accounts/wallets
      operationId: Getaccount
      parameters:
      - name: perPage
        in: query
        description: The number of accounts per request.
        required: false
        style: form
        schema:
          type: number
          example: 1
      - name: page
        in: query
        description: The page offset
        required: false
        style: form
        schema:
          type: number
          example: 1
      - name: orderBy
        in: query
        description: Sort accounts by asc or desc.
        required: false
        style: form
        schema:
          type: string
          example: asc
      responses:
        '200':
          description: ''
          headers: {}
          content:
            application/json:
              schema:
                title: Data9
                required:
                - uid
                - name
                - externalId
                - isDeleted
                - isArchived
                - organizationId
                - network
                - createdAt
                - updatedAt
                - mode
                - accountId
                type: object
                properties:
                  uid:
                    type: string
                  name:
                    type: string
                  externalId:
                    type: string
                  network:
                    type: string
                  mode:
                    type: string
                  isArchived:
                    type: boolean
                  isDeleted:
                    type: boolean
                  organizationId:
                    type: string
                  updatedAt:
                    type: string
                    nullable: true
                  createdAt:
                    type: string
                  Address:
                    type: array
